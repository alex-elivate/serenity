#####################################################################
#   Heat creep guard
#   Watches [temperature_sensor hotend_heatsink]. If the heatsink goes
#   above variable_limit while the hotend heater is on:
#     - during a print: PAUSE, then turn the hotend heater off
#       (to continue: heat the nozzle back to print temp, then RESUME;
#        Mainsail RESUME does not reheat after a manual pause)
#     - otherwise: turn the hotend heater off
#   The hotend fan keeps running until the hotend drops below 50C.
#   Change variable_limit to adjust the trip point.
#   PRINT_START overrides the limit per print: 80C when BED_TEMP >= 90
#   (ABS/ASA in a hot chamber), otherwise 65C (PLA/PETG).
#####################################################################

[gcode_macro _HEATCREEP_GUARD]
variable_limit: 65          # heatsink trip temperature, C
variable_interval: 2        # seconds between checks
gcode:
  {% set sink = printer["temperature_sensor hotend_heatsink"].temperature %}
  {% if sink >= limit and printer.extruder.target > 0 %}
    {% if printer.print_stats.state == "printing" %}
      PAUSE
    {% endif %}
    M104 S0
    STATUS_ERROR
    RESPOND TYPE=error MSG="Heat creep guard: heatsink at {'%.1f' % sink}C (limit {limit}C). Hotend heater turned off. Check the hotend fan."
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_heatcreep_loop DURATION={interval}

[delayed_gcode _heatcreep_loop]
initial_duration: 5
gcode:
  _HEATCREEP_GUARD
