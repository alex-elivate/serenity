#####################################################################
#   First-layer snapshot and layer counter
#   OrcaSlicer > Printer settings > Machine G-code > Layer change G-code:
#       _LAYER_CHANGE LAYER={layer_num}
#   At the start of layer 2 the head lifts 2 mm, parks at the back
#   right, a webcam snapshot is saved to ~/printer_data/first_layers/,
#   and the head returns. The print is not paused.
#####################################################################

[gcode_shell_command first_layer_snapshot]
command: sh /home/alextrusler/first_layer_snapshot.sh
timeout: 15.0
verbose: False

[gcode_macro _LAYER_CHANGE]
description: Called by the slicer at each layer change (LAYER is 0-based)
gcode:
  {% set layer = params.LAYER|default(0)|int %}
  SET_PRINT_STATS_INFO CURRENT_LAYER={layer + 1}
  {% if layer == 1 %}
    _FIRST_LAYER_SNAPSHOT
  {% endif %}

[gcode_macro _FIRST_LAYER_SNAPSHOT]
description: Park, save a webcam snapshot of the first layer, return
gcode:
  {% set pos = printer.gcode_move.gcode_position %}
  {% set park_x = printer.toolhead.axis_maximum.x - 5 %}
  {% set park_y = printer.toolhead.axis_maximum.y - 5 %}
  {% set name = printer.print_stats.filename|replace(' ', '_') %}
  SAVE_GCODE_STATE NAME=_first_layer_snap
  M83
  G1 E-0.8 F2100
  G90
  G1 Z{pos.z + 2} F600
  G1 X{park_x} Y{park_y} F12000
  M400
  G4 P500
  RUN_SHELL_COMMAND CMD=first_layer_snapshot PARAMS="{name}"
  G1 X{pos.x} Y{pos.y} F12000
  G1 Z{pos.z} F600
  G1 E0.8 F2100
  RESTORE_GCODE_STATE NAME=_first_layer_snap
